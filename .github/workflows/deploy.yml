name: Deploy to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: kuad-2026-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  DEPLOY_YEAR: "2026"
  S3_BUCKET: kuadarchive

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-2

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload static assets to S3
        run: |
          echo "Syncing dist/ to s3://${S3_BUCKET}/${DEPLOY_YEAR}/"
          aws s3 sync dist/ s3://${S3_BUCKET}/${DEPLOY_YEAR}/ \
            --exclude "*.html" \
            --exclude ".vite/*" \
            --exclude "route-map.json" \
            --exclude ".DS_Store" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload HTML with no-cache
        run: |
          aws s3 sync dist/ s3://${S3_BUCKET}/${DEPLOY_YEAR}/ \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Upload site icons with no-cache
        run: |
          aws s3 cp dist/favicon.ico s3://${S3_BUCKET}/${DEPLOY_YEAR}/favicon.ico \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "image/vnd.microsoft.icon"
          aws s3 cp dist/manifest.json s3://${S3_BUCKET}/${DEPLOY_YEAR}/manifest.json \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "application/manifest+json"
          aws s3 cp dist/favicon.ico s3://${S3_BUCKET}/favicon.ico \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "image/vnd.microsoft.icon"
          aws s3 cp dist/manifest.json s3://${S3_BUCKET}/manifest.json \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "application/manifest+json"

      - name: Publish static page routing
        run: node scripts/publish-cdn-routes.mjs
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

      - name: Save routing rollback files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloudfront-routing-backup
          path: |
            .deployment/cloudfront-before.json
            .deployment/cloudfront-after.js
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Invalidate CloudFront cache
        run: |
          echo "Creating CloudFront invalidation..."
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/${DEPLOY_YEAR}" "/${DEPLOY_YEAR}/*" "/" "/favicon.ico" "/manifest.json"

      - name: Deployment status
        run: echo "Deployment completed successfully."
